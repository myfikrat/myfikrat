<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — fotook.net</title>
<meta name="description" content="Contact fotook.net to report a problem, ask a general question, sales enquiries, or privacy requests.">
<link rel="icon" href="/favicon.ico" sizes="any"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="canonical" href="https://fotook.net/contact.html">
<style>
  :root{
    --ink:#16140f; --paper:#f7f4ee; --cream:#fffdf8; --blue:#1b4dd6;
    --amber:#e8a317; --green:#1a7f4b; --line:#e8e2d6; --muted:#6b6557;
  }
  *{box-sizing:border-box}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--paper); color:var(--ink); line-height:1.6; -webkit-font-smoothing:antialiased;}
  header{background:var(--cream); border-bottom:1px solid var(--line); padding:16px 22px;}
  .brand{display:flex; align-items:center; gap:10px; max-width:1080px; margin:0 auto; text-decoration:none;}
  .logo{background:var(--ink); color:#fff; width:34px; height:34px; border-radius:8px;
    display:flex; align-items:center; justify-content:center; font-weight:900; font-size:16px;}
  .brand .name{font-weight:900; font-size:18px; color:var(--ink); letter-spacing:-.03em;}
  .brand .name span{color:var(--amber);}

  .wrap{max-width:1080px; margin:0 auto; padding:56px 22px 90px;
    display:grid; grid-template-columns:1fr 1fr; gap:48px; align-items:start;}
  @media(max-width:820px){ .wrap{grid-template-columns:1fr; gap:28px; padding-top:36px;} }

  .lead h1{font-size:clamp(48px,8vw,88px); line-height:.95; letter-spacing:-.04em; margin:0 0 20px; font-weight:900;}
  .lead p{font-size:clamp(18px,2.4vw,22px); color:var(--muted); max-width:420px; margin:0;}

  .card{background:var(--cream); border:1px solid var(--line); border-radius:20px;
    padding:32px; box-shadow:0 12px 40px rgba(22,20,15,.06);}
  .row{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media(max-width:520px){ .row{grid-template-columns:1fr;} }
  label{display:block; font-size:14px; font-weight:800; color:var(--ink); margin:18px 0 7px;}
  label .req{color:var(--blue);}
  input,select,textarea{
    width:100%; padding:13px 14px; font-size:15px; font-family:inherit;
    border:1px solid var(--line); border-radius:11px; background:#fff; color:var(--ink);}
  select{appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236b6557' stroke-width='2.5'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat; background-position:right 14px center; padding-right:40px; cursor:pointer;}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(27,77,214,.12);}
  textarea{min-height:150px; resize:vertical;}
  .err{border-color:var(--amber)!important;}
  button{margin-top:24px; width:100%; padding:15px; font-size:16px; font-weight:800; font-family:inherit;
    color:#fff; background:var(--ink); border:none; border-radius:12px; cursor:pointer;}
  button:hover{background:#000;}
  .direct{font-size:14px; color:var(--muted); margin-top:16px; text-align:center;}
  .direct a{color:var(--blue);}
  footer{border-top:1px solid var(--line); padding:24px 22px; text-align:center; color:#9a9486; font-size:13px;}
  footer a{color:#9a9486;}
</style>
</head>
<body>
<header>
  <a class="brand" href="/">
    <span class="logo">F</span>
    <span class="name">fot<span>OOK</span></span>
  </a>
</header>

<div class="wrap">
  <div class="lead">
    <h1>Contact</h1>
    <p>Contact us to report a problem, clarify any doubts about fotOOK, or just find out more.</p>
  </div>

  <div class="card">
    <form id="cform" novalidate>
      <div class="row">
        <div>
          <label for="name">Your Name <span class="req">*</span></label>
          <input id="name" type="text" autocomplete="name" placeholder="Your name">
        </div>
        <div>
          <label for="email">Your Email <span class="req">*</span></label>
          <input id="email" type="email" autocomplete="email" placeholder="Your email">
        </div>
      </div>

      <label for="subject">Subject <span class="req">*</span></label>
      <select id="subject">
        <option value="" disabled selected>Choose a subject…</option>
        <option value="Report a problem">Report a problem</option>
        <option value="General Information / Contact">General Information / Contact</option>
        <option value="Sales">Sales</option>
        <option value="Privacy">Privacy</option>
      </select>

      <label for="msg">Message <span class="req">*</span></label>
      <textarea id="msg" placeholder="Write a message"></textarea>

      <!-- Honeypot: hidden from humans, bots fill it → we silently drop the message -->
      <input id="company" type="text" name="company" tabindex="-1" autocomplete="off"
             style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0" aria-hidden="true">

      <button id="send" type="submit">Send message</button>
      <div id="status" style="margin-top:14px;font-size:14px;text-align:center;display:none"></div>
      <p class="direct">or email us directly at <a href="mailto:support@fotook.net">support@fotook.net</a></p>
    </form>
  </div>
</div>

<footer>
  &copy; <span id="yr"></span> fotook.net · <a href="/">Back to tools</a> · <a href="/privacy.html">Privacy Policy</a>
  <script>document.getElementById('yr').textContent=new Date().getFullYear();</script>
</footer>

<script>
  var TO = "support@fotook.net";
  var f = document.getElementById('cform');
  var statusEl = document.getElementById('status');
  var sendBtn = document.getElementById('send');

  function setStatus(msg, kind){
    statusEl.style.display = 'block';
    statusEl.textContent = msg;
    statusEl.style.color = kind === 'ok' ? '#1a7f4b' : '#b91c1c';
  }

  f.addEventListener('submit', function(e){
    e.preventDefault();
    var name = document.getElementById('name');
    var email = document.getElementById('email');
    var subject = document.getElementById('subject');
    var msg = document.getElementById('msg');
    [name,email,subject,msg].forEach(function(el){ el.classList.remove('err'); });

    var bad = false;
    if(!name.value.trim()){ name.classList.add('err'); bad=true; }
    if(!email.value.trim()){ email.classList.add('err'); bad=true; }
    if(!subject.value){ subject.classList.add('err'); bad=true; }
    if(!msg.value.trim()){ msg.classList.add('err'); bad=true; }
    if(bad){ setStatus('Please fill in all fields.', 'err'); var fe=document.querySelector('.err'); fe&&fe.focus(); return; }

    var payload = {
      name: name.value.trim(),
      email: email.value.trim(),
      subject: subject.value,
      message: msg.value.trim(),
      company: document.getElementById('company').value  // honeypot
    };

    sendBtn.disabled = true; sendBtn.textContent = 'Sending…';
    setStatus('', 'ok'); statusEl.style.display = 'none';

    fetch('/contact.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(function(r){ return r.json().catch(function(){ return { ok:false, error:'Unexpected server response.' }; }); })
    .then(function(res){
      if (res && res.ok) {
        f.reset();
        setStatus('✓ Thanks! Your message has been sent. We’ll get back to you soon.', 'ok');
      } else {
        setStatus((res && res.error) || 'Could not send. Please email us directly.', 'err');
      }
    })
    .catch(function(){
      // Network / PHP unavailable → fall back to the visitor's email client
      var subj = "[" + payload.subject + "] fotook.net";
      var body = "Subject: " + payload.subject + "\nName: " + payload.name +
        "\nEmail: " + payload.email + "\n\n" + payload.message + "\n";
      setStatus('Opening your email app instead…', 'err');
      window.location.href = "mailto:" + TO +
        "?subject=" + encodeURIComponent(subj) + "&body=" + encodeURIComponent(body);
    })
    .finally(function(){
      sendBtn.disabled = false; sendBtn.textContent = 'Send message';
    });
  });
</script>
</body>
</html>
